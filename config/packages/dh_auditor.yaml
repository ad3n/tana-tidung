# Full configuration reference available at:
# https://damienharper.github.io/auditor-docs/docs/auditor-bundle/configuration/reference.html
dh_auditor:
    enabled: true
    timezone: 'Asia/Jakarta'
    providers:
        doctrine:
            table_prefix: null
            table_suffix: '_audit'
            viewer: false
            ignored_columns:
                - createdAt
                - deletedAt
                - updatedAt
            entities:
                KejawenLab\ApiSkeleton\Entity\ApiClient: ~
                KejawenLab\ApiSkeleton\Entity\Cron: ~
                KejawenLab\ApiSkeleton\Entity\Group: ~
                KejawenLab\ApiSkeleton\Entity\Media: ~
                KejawenLab\ApiSkeleton\Entity\Menu: ~
                KejawenLab\ApiSkeleton\Entity\Permission: ~
                KejawenLab\ApiSkeleton\Entity\Setting: ~
                KejawenLab\ApiSkeleton\Entity\User: ~
                KejawenLab\Application\Entity\Level: ~
                KejawenLab\Application\Entity\Organization: ~
                KejawenLab\Application\Entity\Employee: ~
                KejawenLab\Application\Entity\Unit: ~
                KejawenLab\Application\Entity\Source: ~
                KejawenLab\Application\Entity\FiscalYear: ~
                KejawenLab\Application\Entity\Category: ~
                KejawenLab\Application\Entity\Item: ~
                KejawenLab\Application\Entity\Transaction: ~
                KejawenLab\Application\Entity\TransactionItem: ~
                KejawenLab\Application\Entity\StockLot: ~
                KejawenLab\Application\Entity\TransactionItemAllocation: ~
                KejawenLab\Application\Entity\StockMovement: ~
